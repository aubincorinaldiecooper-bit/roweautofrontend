name: Frontend CI
on:
  pull_request:
  push:
    branches: ["feat/vehicle-intake"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
